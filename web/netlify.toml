# The production deploy uploads web/ as the package root, so no base here.
# A git-linked Netlify build from the repo root would set base = "web".
# The Next.js runtime plugin must be declared explicitly for zip deploys;
# without it Netlify publishes the raw .next directory and every route 404s.
[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# These rules reach only statically-served files; SSR responses get the same
# set (plus the Content-Security-Policy, which only matters on documents)
# from headers() in next.config.ts.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-XSS-Protection = "1; mode=block"

# The public brand images are meant to be embedded in someone else's page: a
# social card is only useful there, and the blanket same-origin rule above
# blocked any client that hotlinks the card rather than re-hosting it. These
# four are public, static and carry nothing to leak. Documents and
# attachments keep same-origin, which is where that header does real work.
# A more specific rule wins over /* for the same header name.
# The demo film is 4.3 MB and Netlify's default for a static asset is
# must-revalidate, so every visit pays a round trip before playback can start.
# The filename carries its export version, so a new cut arrives at a new URL
# and nothing stale can be served for it. Re-exporting under the same name is
# the one thing this rule cannot survive: bump the version when you do.
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/opengraph-image.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/icon.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/apple-icon.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
