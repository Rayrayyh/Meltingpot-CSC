<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Parts demo</title>
    <!-- A 12 s test bench for assets/parts.js: every helper once, on one paused timeline. Not part of the film. -->
    <link rel="stylesheet" href="assets/ui-light.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/icons.js"></script>
    <script src="assets/parts.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper);
        font-family: "MP Inter", Inter, sans-serif; color: var(--ink); }
      #root > .clip { position: absolute; inset: 0; }
      .headline { position: absolute; left: 0; right: 0; top: 46px; text-align: center;
        font: 600 60px/1.1 "MP Fraunces", serif; letter-spacing: -0.02em; color: var(--ink); }
      .headline em { font-style: normal; color: var(--primary); }
      .sub { position: absolute; left: 0; right: 0; top: 128px; text-align: center; font: 500 28px/40px "MP Inter", sans-serif; color: var(--ink-muted); }
      .sub .rot { color: var(--primary); font-weight: 600; height: 40px; min-width: 190px; text-align: left; }
      .morph { position: absolute; left: 70px; top: 960px; width: 260px; height: 48px; font: 600 40px/48px "MP Fraunces", serif; color: var(--ink); }
      .note { width: 220px; padding: 14px 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--edge);
        box-shadow: 0 10px 30px rgba(62, 45, 30, 0.10); font: 400 15px/1.4 "MP Serif", serif; color: var(--ink-muted); }
      .note b { display: block; font: 600 14px/1.3 "MP Inter", sans-serif; color: var(--ink); margin-bottom: 4px; }
      .key { width: 84px; height: 84px; border-radius: 22px; background: var(--sunken); border: 1px solid var(--edge-strong);
        display: flex; align-items: center; justify-content: center; color: var(--primary); box-shadow: 0 12px 28px rgba(62, 45, 30, 0.12); }
      .key svg { width: 38px; height: 38px; }
      /* inside the browser window */
      .app { position: absolute; inset: 0; padding: 36px 44px; }
      .app h2 { font: 600 30px/1.2 "MP Fraunces", serif; margin-bottom: 18px; }
      .composer { width: 640px; min-height: 150px; padding: 18px 20px; border-radius: var(--r-card); background: var(--surface-raised);
        border: 1px solid var(--edge-strong); font: 400 22px/1.5 "MP Serif", serif; color: var(--ink); }
      .row { display: flex; gap: 12px; margin-top: 18px; align-items: center; }
      .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 999px; font: 600 17px/1 "MP Inter", sans-serif; }
      .btn.primary { background: var(--primary); color: var(--on-primary); }
      .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--edge-strong); }
      .side { position: absolute; left: 740px; top: 36px; width: 400px; }
      .thinking { font: 500 19px/1.4 "MP Inter", sans-serif; margin-bottom: 14px; color: var(--ink); }
      .item { padding: 12px 14px; border-radius: var(--r-control); background: var(--surface-raised); border: 1px solid var(--edge);
        font: 500 16px/1.35 "MP Inter", sans-serif; color: var(--ink); box-shadow: var(--shadow-card); }
      .item small { display: block; font-weight: 400; color: var(--ink-faint); font-size: 13px; }
      .shared { position: absolute; left: 44px; top: 400px; width: 640px; font: 400 21px/1.6 "MP Serif", serif; color: var(--ink-muted); }
      .tile { width: 1200px; height: 700px; border-radius: 14px; background: var(--surface); border: 1px solid var(--edge-strong); overflow: hidden; }
      .tile i { display: block; height: 52px; background: var(--sunken); border-bottom: 1px solid var(--edge); }
      .tile b { display: block; margin: 40px; height: 40px; width: 50%; border-radius: 10px; background: var(--edge); }
      .phone-ui { padding: 70px 22px 0; font: 600 20px/1.3 "MP Fraunces", serif; }
      .phone-ui p { margin-top: 10px; font: 400 15px/1.45 "MP Serif", serif; color: var(--ink-muted); }
      #orbit-core { position: absolute; left: 1650px; top: 520px; width: 0; height: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="float-box" style="position:absolute;inset:0"></div>
        <h1 class="headline" id="hl">Write it once, <em>share it with the class.</em></h1>
        <div class="sub">Built for <span class="rot" id="rot"></span></div>
        <div class="morph" id="morph"></div>
        <div id="orbit-core"></div>
      </div>
    </div>
    <script>
      (function () {
        var DUR = 12;
        window.__timelines = window.__timelines || {};
        window.__events = [];
        var tl = gsap.timeline({ paused: true });
        var I = window.ICONS || {};
        var icon = function (n) { return I[n] || I[n + "-bold"] || ""; };
        var scene = document.getElementById("scene");

        // 4. dot grid with the soft halftone (whole film)
        MP.dotGrid(document.getElementById("bg"), { gap: 26, r: 1.4, halftone: { t0: 0, t1: DUR, amp: 1.4, radius: 360 } });

        // 5. floaters: note cards and keycaps drifting in 3D around the window
        var notes = [
          '<div class="note"><b>Week 3 notes</b>Cell membranes let some things through and keep others out.</div>',
          '<div class="key">' + icon("cards") + "</div>",
          '<div class="note"><b>Lab recap</b>Osmosis moves water toward the higher concentration of solute.</div>',
          '<div class="key">' + icon("calendar-blank") + "</div>",
          '<div class="note"><b>Review</b>Mitochondria make most of the cell\'s ATP.</div>',
          '<div class="key">' + icon("magnifying-glass") + "</div>"
        ];
        MP.floaters(tl, { container: "#float-box", items: notes, seed: "demo", t0: 0.2, t1: DUR, rx: 860, ry: 430, zMin: -380, zMax: 120 });

        // 1. headline word-by-word blur, 12a word rotate, 12b morph
        MP.blurWords(tl, { el: "#hl", t: 0.3, stagger: 0.09 });
        MP.wordRotate(tl, { el: "#rot", words: ["notes", "corrections", "flashcards", "practice tests"], t: 1.6, every: 1.4 });
        MP.morphText(tl, { el: "#morph", texts: ["raw", "organized", "shared"], t: 6.2, morph: 1.2, hold: 1.4 });

        // 10. browser window and phone frames
        var win = MP.frames.safari(scene, { x: 360, y: 210, width: 1200, height: 700, url: "meltingpots.xyz" });
        win.root.id = "win";
        win.screen.innerHTML =
          '<div class="app" id="app"><h2>New note</h2><div class="composer" id="composer"></div>' +
          '<div class="row"><span class="btn primary" id="share">Share with class</span><span class="btn ghost">Save draft</span></div>' +
          '<p class="shared" id="shared">The cell membrane is <span id="fix">selectively permeable, so it controls what enters and leaves</span>.</p>' +
          '<div class="side"><div class="thinking" id="think">Organizing your note</div><div id="list" style="height:260px">' +
          '<div class="item">Key terms<small>membrane, osmosis, solute</small></div>' +
          '<div class="item">Summary<small>What moves across the membrane</small></div>' +
          '<div class="item">Questions<small>Two to check yourself</small></div></div></div></div>';
        tl.fromTo(win.root, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.6);
        var phone = MP.frames.iphone(scene, { x: 1600, y: 600, width: 220 });
        phone.screen.innerHTML = '<div class="phone-ui">Practice test<p>Which part of the cell controls what enters?</p></div>';
        tl.fromTo(phone.root, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 7.6);

        // 3. cursor: move, click into the composer, 2. type, hover and click the button
        var cur = MP.cursor.create(scene, { x: 1300, y: 980 });
        cur.moveTo(tl, { x: 700, y: 420, t: 1.4, dur: 1.0 });
        cur.click(tl, { t: 2.5 });
        MP.typeText(tl, { el: "#composer", text: "membrane lets some stuff in, osmosis = water moves", t: 2.7, cps: 16, jitterSeed: 7, caretUntil: 6.0 });
        cur.moveTo(tl, { x: 560, y: 520, t: 5.6, dur: 0.8 });
        cur.hover(tl, { target: "#share", t: 6.3, until: 6.9 });
        cur.click(tl, { t: 6.55, target: "#share" });

        // 8. shimmer while organizing, 7. stacking list of the organized parts
        MP.shimmer(tl, { el: "#think", t0: 6.7, t1: 9.0 });
        tl.fromTo("#think", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.6);
        MP.stackList(tl, { container: "#list", t: 7.0, every: 0.55 });

        // 9. marker sweep over the corrected sentence
        MP.markerSweep(tl, { el: "#fix", t: 8.1, dur: 0.6, color: "var(--added-soft)" });

        // 6. orbit of feature icons around a pot keycap above the phone
        var core = document.getElementById("orbit-core");
        core.innerHTML = '<div class="key" style="position:absolute;left:-42px;top:-42px">' + icon("note-pencil") + "</div>";
        tl.fromTo(core, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.8);
        MP.orbit(tl, { container: core, items: [icon("cards"), icon("calendar-blank"), icon("clock-counter-clockwise"), icon("lightbulb")],
          radius: 120, size: 48, t0: 7.8, t1: DUR, duration: 14, cx: 0, cy: 0 });

        // 11. grid zoom-out: the window becomes one tile among many (layout move)
        var tiles = [];
        for (var i = 0; i < 19; i++) { var d = document.createElement("div"); d.className = "tile"; d.innerHTML = "<i></i><b></b>"; scene.appendChild(d); tiles.push(d); }
        MP.gridZoomOut(tl, { container: scene, hero: win.root, heroRect: { x: 360, y: 210, w: 1200, h: 700 }, tiles: tiles,
          area: { x: 80, y: 120, w: 1760, h: 900 }, cols: 5, rows: 4, t: 9.6, dur: 1.2, seed: 3 });

        // extra: a scroll inside the window, before the grid move
        MP.scrollTo(tl, { el: "#app", to: 60, t: 8.8, dur: 0.7 });

        MP.driverTween(tl, DUR);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
